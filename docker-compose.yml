# Airflow 2.x (LocalExecutor) + Postgres (metadatos de Airflow) + MySQL (datos del proyecto).
# Arranque:  docker compose up -d --build     ·   Interfaz: http://localhost:8080
x-airflow-common: &airflow-common
  build: .
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    PYTHONPATH: /opt/airflow
    # Dentro de la red de Docker, MySQL se llama "mysql" y usa el puerto 3306
    MYSQL_HOST: mysql     
    KAFKA_BOOTSTRAP: kafka:9092
    MYSQL_PORT: "3306"
    STAGING_DIR: /opt/airflow/data/staging
    CSV_2019_PATH: /opt/airflow/data/input/saber11_2019.csv
  volumes:
    - ./dags:/opt/airflow/dags
    - ./etl:/opt/airflow/etl
    - ./data:/opt/airflow/data
    - ./dashboards:/opt/airflow/dashboards
    - ./logs:/opt/airflow/logs
    - ./streaming:/opt/airflow/streaming:ro
    - ./models:/opt/airflow/models:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy
    kafka:
      condition: service_healthy  

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  mysql:
    image: mysql:8.0
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${RAW_DB_NAME}
    ports:
      - "3307:3306"   # 3307 en tu computador para no chocar con tu MySQL local
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/data/staging
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs /opt/airflow/data
        exec /entrypoint airflow version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    user: "0:0"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: always

  jupyter:
       build: ./notebooks
       profiles: ["analisis"]
       env_file: .env
       environment:
         MYSQL_HOST: mysql
         MYSQL_PORT: "3306"
       ports:
         - "8888:8888"
       volumes:
         - ./notebooks:/work/notebooks
         - ./reports:/work/reports
       working_dir: /work/notebooks
       depends_on:
         mysql:
           condition: service_healthy
       command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=saber11

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"   # para scripts desde tu computador
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10
    restart: always

  kafka-init:
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic saber11.estudiantes --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic saber11.predicciones --partitions 1 --replication-factor 1
    restart: "no"  

  productor:
    build: ./streaming
    profiles: ["streaming"]
    env_file: .env
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP: kafka:9092
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
    volumes:
      - ./streaming:/app/streaming:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    working_dir: /app
    command: python streaming/productor.py --limit 1000 --delay 0.3
    depends_on:
      kafka:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: "no"

  consumidor:
    build: ./streaming
    profiles: ["streaming"]
    environment:
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./streaming:/app/streaming:ro
      - ./models:/app/models:ro
      - ./data:/app/data
    working_dir: /app
    command: python streaming/consumidor.py
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # Dashboard operativo en tiempo real (Streamlit). Lee data/streaming/predicciones.jsonl
  # que escribe el consumidor; NO consulta MySQL. Interfaz: http://localhost:8501
  dashboard:
    build: ./streaming/dashboard
    profiles: ["streaming"]
    environment:
      PYTHONUNBUFFERED: "1"
      RUTA_PREDICCIONES: /app/data/streaming/predicciones.jsonl
    ports:
      - "8501:8501"
    volumes:
      - ./streaming:/app/streaming:ro
      - ./data:/app/data
    working_dir: /app
    restart: always

volumes:
  postgres-db:
  mysql-data:
